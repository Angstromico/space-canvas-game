<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Canvas Game Bullet Hell Style on Space" />
    <meta
      property="og:title"
      content="Manuel Morales Canvas Space Shooting Game"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Angstromico/space-canvas-game/master/canvas.png"
    />
    <meta property="fb:app_id" content="1234567890" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://manuel-morales-space.canvas-game.netlify.app/"
    />

    <meta
      property="og:description"
      content="A Canvas Game to Shooting on Space"
    />
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:image"
      content="https://raw.githubusercontent.com/Angstromico/space-canvas-game/master/canvas.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <title>Space Game</title>
    <script type="module" crossorigin src="/assets/index-BM2vhRvp.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-qSuAMdey.css">
  </head>
  <body>
    <!-- Sounds Effects  -->
    <audio id="laser" src="/assets/laser-B0YxqDaJ.wav"></audio>
    <audio id="impact" src="/assets/short-CGIp3weI.wav"></audio>
    <audio id="destruction" src="/assets/metal-wRHasgRu.wav"></audio>
    <audio id="over" src="/assets/laught-B_bsk1ka.mp3"></audio>
    <!-- OST -->
    <audio id="main" loop src="/assets/main-DTARZTU2.mp3"></audio>
    <audio id="pause" loop src="/assets/pause-VErJ8Ju0.mp3"></audio>
    <audio id="pause-alternate" loop src="/assets/Paused_at_Dusk-vDKVofPU.mp3"></audio>
    <div class="fixed text-white ml-2 mt-1 select-none">
      <span>SCORE:</span><span id="score"> 0</span>
    </div>
    <canvas></canvas>

    <!-- Notification System -->
    <div id="notification-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div
      class="fixed inset-0 flex items-center justify-center bg-slate-950/50 backdrop-blur-sm z-50 overflow-y-auto overflow-x-hidden p-4 select-none"
      id="initial"
    >
      <div class="relative w-full max-w-4xl p-6 md:p-8 rounded-3xl bg-slate-950/90 backdrop-blur-xl border border-cyan-500/20 shadow-[0_0_50px_rgba(6,182,212,0.15)] text-white mx-auto flex flex-col md:grid md:grid-cols-12 md:gap-8 max-h-[90vh] overflow-y-auto overflow-x-hidden font-rajdhani">
        
        <!-- LEFT PANEL: Mission Hub -->
        <div class="md:col-span-6 flex flex-col justify-between space-y-6">
          
          <!-- Logo & Title -->
          <div class="text-center md:text-left space-y-1">
            <h1 class="text-4xl md:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 font-orbitron drop-shadow-[0_0_15px_rgba(6,182,212,0.4)] uppercase neon-pulse">
              NEBULA STRIKE
            </h1>
            <p class="text-cyan-400/80 text-xs tracking-[0.3em] font-orbitron uppercase font-bold">
              Canvas Space Tactical Shooter
            </p>
          </div>

          <!-- Pilot Dashboard -->
          <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 relative overflow-hidden group">
            <div class="absolute inset-0 bg-[linear-gradient(to_bottom,rgba(6,182,212,0.03)_1px,transparent_1px)] bg-[size:100%_4px] pointer-events-none"></div>
            <div class="relative flex items-center justify-between">
              <div class="text-left">
                <p class="text-[10px] text-slate-400 tracking-wider font-orbitron uppercase">MISSION SCORE</p>
                <div class="flex items-baseline gap-1 mt-1">
                  <span id="score2" class="text-4xl font-bold font-orbitron text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.25)]">0</span>
                  <span class="text-xs text-slate-500 font-orbitron">PTS</span>
                </div>
              </div>
              <div class="h-10 w-[1px] bg-slate-800"></div>
              <div class="text-right flex flex-col items-end">
                <p class="text-[10px] text-slate-400 tracking-wider font-orbitron uppercase">ACTIVE PILOT</p>
                <div class="flex items-center gap-2 mt-1">
                  <span id="current-pilot-display" class="text-lg font-bold font-orbitron text-cyan-400 tracking-wide uppercase drop-shadow-[0_0_8px_rgba(34,211,238,0.25)] block">RECRUIT</span>
                  <button id="sign-off" class="hidden text-[9px] bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-2 py-0.5 rounded uppercase font-orbitron transition-all">
                    Sign Off
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Launch Button Container -->
          <div class="relative group w-full">
            <div class="absolute -inset-1 bg-gradient-to-r from-yellow-500 to-amber-500 rounded-full blur opacity-30 group-hover:opacity-60 transition duration-1000 group-hover:duration-200 animate-pulse"></div>
            <button
              id="start"
              class="relative w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black tracking-widest text-lg rounded-full font-orbitron shadow-[0_0_20px_rgba(234,179,8,0.2)] hover:shadow-[0_0_30px_rgba(234,179,8,0.4)] transform hover:scale-[1.01] transition-all duration-300 uppercase overflow-hidden"
            >
              START GAME
            </button>
          </div>

        </div>

        <!-- RIGHT PANEL: Config & Records -->
        <div class="md:col-span-6 flex flex-col space-y-6 mt-6 md:mt-0">
          
          <!-- Pilot Registry Header / Toggler -->
          <div id="pilot-registry-section" class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-3 mb-3">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-xs font-bold text-slate-200 tracking-widest font-orbitron uppercase">Pilot Registry</span>
              </div>
              <button class="first-button flex items-center justify-center p-1 rounded-lg hover:bg-slate-800/80 transition-all text-cyan-400" type="button">
                <div class="animated-icon1">
                  <span></span><span></span><span></span>
                </div>
              </button>
              <a class="navbar-brand hidden" href="/">Add Player</a> <!-- Kept for compatibility but hidden -->
            </div>

            <!-- Pilot List (Selection/Management) -->
            <div id="pilot-management" class="mb-4 hidden">
              <div class="flex items-center justify-between mb-2">
                <p class="text-[10px] text-slate-400 tracking-wider font-orbitron uppercase">ACTIVE ROSTER</p>
                <div class="relative">
                  <input 
                    id="pilot-search" 
                    type="text" 
                    placeholder="SEARCH ID..." 
                    class="bg-slate-950/50 border border-slate-800 focus:border-cyan-500/50 text-[9px] text-white placeholder-slate-600 rounded-lg px-2 py-1 focus:outline-none w-24 transition-all font-orbitron uppercase"
                  />
                </div>
              </div>
              <div id="pilot-list" class="flex flex-col gap-2 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
                <!-- Pilots will be injected here -->
              </div>
            </div>

            <!-- Pilot Registry Form -->
            <div class="form-container relative w-full !p-0 !m-0 !top-0 !left-0 !position-relative" id="form-container">
              <form
                class="w-full value toggle-form !p-0 !m-0"
                id="register"
              >
                <p id="register-label" class="text-[10px] text-slate-400 tracking-wider font-orbitron uppercase mb-2">NEW PILOT REGISTRATION</p>
                <div class="mb-3">
                  <input
                    class="bg-slate-950 border border-slate-800 focus:border-cyan-500 text-white placeholder-slate-600 rounded-xl w-full py-2 px-3 focus:outline-none focus:ring-1 focus:ring-cyan-500/50 transition-all font-rajdhani text-base"
                    id="username"
                    type="text"
                    placeholder="ENTER PILOT CALLSIGN"
                    maxLength="15"
                  />
                </div>
                <button
                  class="w-full bg-slate-800 text-slate-500 font-bold py-2 px-4 rounded-xl opacity-50 cursor-not-allowed font-orbitron tracking-widest text-xs uppercase transition-all duration-300"
                  type="submit"
                  id="btnSubmit"
                >
                  Confirm Callsign
                </button>
              </form>
            </div>
          </div>

          <!-- Difficulty Control -->
          <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4">
            <p class="text-xs text-slate-400 tracking-widest font-orbitron uppercase mb-3 text-left">Sector Threat Level</p>
            <div class="levels">
              <div class="inner-levels level-chosen">EASY</div>
              <div class="inner-levels">NORMAL</div>
              <div class="inner-levels">HARD</div>
            </div>
          </div>

          <!-- High Scores List -->
          <div class="flex flex-col space-y-3">
            <button
              id="show-list"
              class="show-list w-full text-center"
            >
              Show List
            </button>

            <div class="score-list toggle">
              <h2 class="max-score text-center mb-4">BEST SCORES</h2>
              <ul class="list list-none"></ul>
              <div class="inner-list" id="inner"></div>
              <div class="button-container flex justify-center mt-3">
                <button
                  id="show-all"
                  class="show-list text-center text-xs py-1.5 px-3"
                >
                  Show All Results
                </button>
              </div>
            </div>
          </div>

        </div>

        <!-- BOTTOM PANEL: System Sound Feed -->
        <div class="md:col-span-12">
          <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4">
            <p class="text-xs text-slate-400 tracking-widest font-orbitron uppercase mb-3 text-left">System Sound Feed</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-center">
              <!-- Music Mute controls -->
              <div class="flex items-center justify-between w-full gap-3 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
                <span class="text-[10px] text-slate-400 font-orbitron uppercase pl-2">MUSIC</span>
                <div class="flex gap-1.5">
                  <div class="no px-3 py-1 rounded-lg font-orbitron text-[10px] font-bold transition-all duration-300 text-center flex items-center justify-center">
                    MUTE
                  </div>
                  <div class="sound chosen px-3 py-1 rounded-lg font-orbitron text-[10px] font-bold transition-all duration-300 text-center flex items-center justify-center">
                    PLAY
                  </div>
                </div>
              </div>

              <!-- Pause Track selection -->
              <div class="flex items-center justify-between w-full gap-3 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
                <span class="text-[10px] text-slate-400 font-orbitron uppercase pl-2">PAUSE TRACK</span>
                <select id="pause-track-select" class="bg-slate-900 text-cyan-400 font-orbitron text-[10px] font-bold py-1 px-2 rounded-lg border border-cyan-500/20 focus:outline-none focus:ring-1 focus:ring-cyan-500/50 transition-all cursor-pointer">
                  <option value="1">ORIGINAL</option>
                  <option value="2">DUSK</option>
                </select>
              </div>

              <!-- Ambient button -->
              <button
                id="sounds-off"
                class="w-full font-orbitron font-bold text-[10px] px-4 py-2.5 rounded-xl border border-blue-500/20 bg-blue-950/15 text-blue-400 hover:bg-blue-950/30 hover:border-blue-500/40 transition-all duration-300 uppercase sm:col-span-2 lg:col-span-1"
              >
                DISABLE AMBIENT SOUNDS
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

  </body>
</html>
